name: Cloud Status Monitor

on:
# NOTE: the `schedule:` block was intentionally removed in PR #3.
# GitHub's built-in scheduler never fired for this workflow, so
# cron-job.org dispatches it via workflow_dispatch every 15 minutes.
  workflow_dispatch:
    inputs:
      test_discord:
        description: 'Post a labeled test message to Discord via the stored DISCORD_WEBHOOK secret (no outage is happening)'
        type: boolean
        default: false
  push:
    paths:
      - 'scripts/check.py'
      - '.github/workflows/monitor-v2.yml'

permissions:
  contents: write

# Serialize monitor runs. Never let an older run overwrite a newer result.
concurrency:
  group: cloud-status-monitor
  cancel-in-progress: false

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run status checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_DISCORD: ${{ inputs.test_discord }}
        run: python scripts/check.py

      - name: Publish status safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Preserve this run's fresh results outside the worktree. Rebase-style
          # recovery is done by rebuilding the commit on the latest main, rather
          # than attempting to merge two generated JSON snapshots.
          snapshot="$(mktemp -d)"
          cp status.json "$snapshot/status.json"
          cp docs/status.json "$snapshot/docs-status.json"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3: syncing with origin/main"
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot/status.json" status.json
            cp "$snapshot/docs-status.json" docs/status.json
            git add -- status.json docs/status.json

            if git diff --cached --quiet; then
              echo "Status files already match the published data."
              exit 0
            fi

            git commit -m "Update cloud status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push origin HEAD:main; then
              echo "Status files published successfully."
              exit 0
            fi

            echo "Push raced with another main-branch update; retrying from latest main."
            sleep 2
          done

          echo "::error::Could not publish status after three attempts."
          exit 1
