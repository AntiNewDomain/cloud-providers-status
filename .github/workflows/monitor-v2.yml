name: Cloud Status Monitor

on:
  schedule:
    # Run at five-minute UTC boundaries. GitHub scheduling is best-effort.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping scheduled and manually triggered checks.
concurrency:
  group: cloud-status-monitor
  cancel-in-progress: false

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run status checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/check.py

      - name: Commit and push status update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Do not hide staging failures: a green workflow must mean the files
          # were staged successfully and the push either happened or was unnecessary.
          git add -- status.json docs/status.json

          if git diff --cached --quiet; then
            echo "No status-file changes to commit."
          else
            git commit -m "Update cloud status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
            echo "Status files committed and pushed to main."
          fi
