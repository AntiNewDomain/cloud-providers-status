name: Cloud Status Monitor

on:
  schedule:
    # Every 5 minutes, offset to :03/:08/... to avoid GitHub's top-of-hour load where scheduled runs get delayed or dropped; committing this file re-registers the schedule
    - cron: '3-58/5 * * * *'

  workflow_dispatch:  # Allow manual runs

permissions:
  contents: write
  actions: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run status checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/check.py

      - name: Commit and push status update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json docs/status.json || true
          git diff --staged --quiet || (git commit -m "Update cloud status $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)

      - name: Schedule next run
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 300
          curl -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AntiNewDomain/cloud-providers-status/actions/workflows/monitor-v2.yml/dispatches -d '{"ref":"main"}'
