name: Cloud Status Monitor

on:
  workflow_dispatch:
  schedule:
    # Low-frequency safety net only (GitHub cron is unreliable for frequent runs)
    - cron: '17 */3 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-status-monitor
  cancel-in-progress: false

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run status checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/check.py

      - name: Commit and push status update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- status.json docs/status.json
          if git diff --cached --quiet; then
            echo "No status-file changes to commit."
          else
            git commit -m "Update cloud status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
            echo "Status files committed and pushed."
          fi

      - name: Schedule next run in 4 minutes
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Waiting 4 minutes before dispatching next run..."
          sleep 240

          echo "Dispatching next workflow run..."
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AntiNewDomain/cloud-providers-status/actions/workflows/monitor-v2.yml/dispatches \
            -d '{"ref":"main"}'

          echo "Next run successfully dispatched."
