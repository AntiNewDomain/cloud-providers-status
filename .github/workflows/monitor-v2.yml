name: Cloud Status Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check.py'
      - '.github/workflows/monitor-v2.yml'
  schedule:
    # GitHub scheduled checks every 5 minutes; each run should finish quickly.
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-status-monitor
  cancel-in-progress: false

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run status checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/check.py

      - name: Commit and push status update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- status.json docs/status.json
          if git diff --cached --quiet; then
            echo "No status-file changes to commit."
          else
            git commit -m "Update cloud status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
            echo "Status files committed and pushed."
          fi
